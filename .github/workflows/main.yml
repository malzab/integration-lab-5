name: "CI pipeline"

on:
  push:
    branches:
      [main]
  pull_request:
    branches:
      [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      
      - name: node instalacja
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install
      
      - run: npx eslint .

      - run: npm test

